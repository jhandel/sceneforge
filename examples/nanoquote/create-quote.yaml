name: "new-demo"
title: "New Demo"
steps:
  - id: "step-1"
    script: "steps"
    actions:
      - action: "navigate"
        path: "/app/{orgSlug}/quotes"
        waitFor:
          type: "idle"
          timeout: 15000
      - action: "click"
        target:
          type: "selector"
          selector: "button:has-text(\"New Quote\")"
        highlight: true
      - action: wait
        waitFor:
          type: text
          value: "Drop your DXF"
          timeout: 10000
      - action: upload
        file: "test_models/dxf/tableSupport.dxf"
      - action: wait
        waitFor:
          type: text
          value: "sources found"
          timeout: 30000
      - action: "click"
        target:
          type: "selector"
          selector: "button:has-text(\"Next: Configure Sources\")"
        highlight: true
      - action: "click"
        target:
          type: "selector"
          selector: "html.light"
        highlight: true
      - action: "click"
        target:
          type: "selector"
          selector: "html.light"
        highlight: true
      - action: "click"
        target:
          type: "selector"
          selector: "html.light"
        highlight: true
      - action: "click"
        target:
          type: "selector"
          selector: "button:has-text(\"Next: Customer & Options\")"
        highlight: true
      - action: "click"
        target:
          type: "selector"
          selector: "[placeholder=\"Search by name, email, or company...\"]"
        highlight: true
      - action: "click"
        target:
          type: "selector"
          selector: "xpath=//span[contains(text(), \"Sam Alfanzo\")]"
        highlight: true
      - action: "click"
        target:
          type: "selector"
          selector: "xpath=//html[contains(text(), \"import { injectIntoGlobalHook \")]"
        highlight: true
      - action: "click"
        target:
          type: "selector"
          selector: "button:has-text(\"Al\")"
        highlight: true
      - action: "click"
        target:
          type: "selector"
          selector: "button:has-text(\"6061-T6\")"
        highlight: true
      - action: "click"
        target:
          type: "selector"
          selector: "html.light"
        highlight: true
      - action: "click"
        target:
          type: "selector"
          selector: "div:nth-child(3) > div:nth-child(2) > div:nth-child(2) > div:nth-child(2) >
            div:nth-child(3) > input"
        highlight: true
      - action: "type"
        target:
          type: "selector"
          selector: "div:nth-child(3) > div:nth-child(2) > div:nth-child(2) > div:nth-child(2) >
            div:nth-child(3) > input"
        text: "10"
      - action: "click"
        target:
          type: "selector"
          selector: "button:has-text(\"Create Quote\")"
        highlight: true
      - action: "navigate"
        path: "/app/{orgSlug}/quotes/md758waaryxxp4t8r53z0cc8y57zh89m"
        waitFor:
          type: "idle"
          timeout: 15000

  # Step 1: Navigate and view the quotes dashboard
  - id: view-dashboard
    script: "From the quotes dashboard, you can see all your existing quotes organized by status. Let's create a new quote."
    actions:
      - action: navigate
        path: "/app/{orgSlug}/quotes"
        waitFor:
          type: text
          value: "Quotes"
          timeout: 15000
      - action: wait
        duration: 5000

  # Step 2: Start new quote and upload file
  - id: start-quote-upload
    script: "Click New Quote to open the quote wizard. Upload your DXF or STEP files and the system will automatically analyze the geometry."
    actions:
      - action: click
        target:
          type: button
          text: "New Quote"
        highlight: true
      - action: wait
        waitFor:
          type: text
          value: "Drop your DXF"
          timeout: 10000
      - action: upload
        file: "test_models/dxf/tableSupport.dxf"
      - action: wait
        waitFor:
          type: text
          value: "sources found"
          timeout: 30000


  # Step 3: Review analysis results
  - id: review-analysis
    script: "The system extracts cut paths, calculates perimeters, and identifies the material area needed. you can make sure the dimensions look correct, merge layers, or even ignore identified parts."
    actions:
      - action: click
        target:
          type: button
          text: "Next: Configure Sources"
        highlight: true
      - action: wait
        duration: 1000
      - action: wait
        waitFor:
          type: text
          value: "Configure each source"
          timeout: 10000

  # Step 4: Configure sources and proceed to customer
  - id: configure-sources
    script: "Here you can configure material type, thickness, and machine settings for each part. Click Next to select a customer."
    actions:
      - action: wait
        duration: 1000
      - action: click
        target:
          type: button
          text: "Next: Customer & Options"
        highlight: true
      - action: wait
        waitFor:
          type: text
          value: "Customer & Contact"
          timeout: 10000

  # Step 5: Select customer, material and create quote
  - id: create-quote-and-process
    script: "Select a customer and material, then click Create Quote. The system calculates pricing, operator time, material use, and machine time."
    actions:
      - action: wait
        duration: 500
      # Click the customer dropdown
      - action: click
        target:
          type: selector
          selector: "[placeholder='Search by name, email, or company...']"
        highlight: true
      - action: wait
        duration: 500
      # Select first customer option
      - action: click
        target:
          type: selector
          selector: "[role='option']"
      - action: wait
        duration: 500
      # Click the material dropdown (use XPath to find button near Material label)
      - action: click
        target:
          type: selector
          selector: "xpath=//label[contains(text(), 'Material')]/parent::div//button[@data-state]"
        highlight: true
      - action: wait
        duration: 500
      # Expand the first material category (AL)
      - action: click
        target:
          type: selector
          selector: "[role='button']:has-text('AL')"
      - action: wait
        duration: 300
      # Expand the first grade (6061-T6)
      - action: click
        target:
          type: selector
          selector: "[role='button']:has-text('6061')"
      - action: wait
        duration: 300
      # Select the first material option after expanding
      - action: click
        target:
          type: selector
          selector: "[role='option']:not(:has-text('Clear'))"
      - action: wait
        duration: 500
      # Click the machine dropdown
      - action: click
        target:
          type: selector
          selector: "button:has-text('Select machine')"
        highlight: true
      - action: wait
        duration: 300
      # Select the first machine option
      - action: click
        target:
          type: selector
          selector: "[role='option']"
      - action: wait
        duration: 1000
      # Now click Create Quote
      - action: click
        target:
          type: button
          text: "Create Quote"
        highlight: true
      - action: wait
        waitFor:
          type: textHidden
          value: "New Quote"
          timeout: 30000
      - action: wait
        duration: 1000

  # Step 6: Conclusion
  - id: conclusion
    script: "That's the quote creation flow. From here you can review pricing, adjust quantities, and send the quote to your customer."
    actions:
      - action: wait
        duration: 1500
